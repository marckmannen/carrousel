name: Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - name: Deploy
      run: |
        cd ~/website/carrousel
        git reset --hard HEAD
        git clean -fd
        git pull origin main
        rm -rf vendor/
        composer install --no-dev --optimize-autoloader --no-interaction
        docker compose exec -T webserver php artisan migrate --force
        docker compose exec -T webserver php artisan config:clear
        docker compose exec -T webserver php artisan cache:clear
        docker compose exec -T webserver php artisan route:cache
        docker compose exec -T webserver php artisan view:cache
